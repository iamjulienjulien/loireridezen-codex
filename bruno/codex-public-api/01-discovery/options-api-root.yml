info:
    name: Options API root
    type: http
    seq: 3
    tags:
        - options
        - production-safe
        - success

http:
    method: OPTIONS
    url: "{{baseUrl}}/api/v1"

docs: |
    Checks the methods and CORS policy advertised by the API root.

runtime:
    assertions:
        - expression: res.status
          operator: eq
          value: "204"
    scripts:
        - type: tests
          code: |-
              const allow = res.getHeader("allow") || "";
              const methods = res.getHeader("access-control-allow-methods") || "";
              test("returns an empty preflight response", function () {
                  expect(res.body === null || res.body === "").to.equal(true);
                  expect(res.getHeader("cache-control")).to.equal("no-store");
              });
              test("advertises read-only methods and CORS", function () {
                  ["GET", "HEAD", "OPTIONS"].forEach((method) => {
                      expect(allow).to.include(method);
                      expect(methods).to.include(method);
                  });
                  expect(res.getHeader("access-control-allow-origin")).to.equal("*");
                  expect(res.getHeader("access-control-allow-headers")).to.include("Content-Type");
                  expect(res.getHeader("access-control-allow-credentials")).to.equal(undefined);
              });

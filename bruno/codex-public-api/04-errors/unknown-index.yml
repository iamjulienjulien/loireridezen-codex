info:
    name: Unknown index
    type: http
    seq: 2
    tags: [get, production-safe, error]

http:
    method: GET
    url: "{{baseUrl}}/api/v1/indexes/index-inconnu"

docs: Confirms the generic 404 response for an unknown index.

runtime:
    assertions:
        - expression: res.status
          operator: eq
          value: "404"
    scripts:
        - type: tests
          code: |-
              const instance = "/api/v1/indexes/index-inconnu";
              const serialized = JSON.stringify(res.body);
              test("returns public Problem Details without cache", function () {
                  expect(res.getHeader("content-type")).to.match(/^application\/problem\+json/i);
                  expect(res.getHeader("cache-control")).to.equal("no-store");
                  expect(res.getHeader("access-control-allow-origin")).to.equal("*");
                  expect(res.getHeader("access-control-allow-methods")).to.include("GET");
                  expect(res.getHeader("access-control-allow-headers")).to.include("Content-Type");
                  expect(res.getHeader("access-control-allow-credentials")).to.equal(undefined);
                  expect(res.body.type).to.match(/^https?:\/\//);
                  expect(res.body.title).to.equal("Resource not found");
                  expect(res.body.status).to.equal(404);
                  expect(res.body.detail).to.be.a("string").and.not.empty;
                  expect(res.body.instance).to.equal(instance);
              });
              test("does not reveal implementation details", function () {
                  ["stack", "Zod", "/Users/", "dataFile", "env"].forEach((fragment) =>
                      expect(serialized).not.to.include(fragment)
                  );
              });

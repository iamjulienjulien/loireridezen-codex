name: CI

on:
    pull_request:
        branches:
            - dev
            - main
    push:
        branches:
            - dev
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    promotion:
        name: Promotion policy
        runs-on: ubuntu-latest
        timeout-minutes: 2

        steps:
            - name: Allow main promotions only from dev
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  BASE_REF: ${{ github.base_ref }}
                  HEAD_REF: ${{ github.head_ref }}
              run: |
                  if [[ "${EVENT_NAME}" == "pull_request" && "${BASE_REF}" == "main" && "${HEAD_REF}" != "dev" ]]; then
                      echo "::error::Production changes must be promoted from dev to main."
                      exit 1
                  fi

                  echo "Promotion policy satisfied."

    quality:
        name: Quality gate
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run the complete quality gate
              env:
                  SITE_URL: https://example.test
              run: pnpm check
